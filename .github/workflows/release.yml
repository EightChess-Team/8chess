name: 8Chess Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64"
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: "-C target-cpu=generic"
            archive: tar.gz
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            rustflags: "-C target-cpu=x86-64"
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            rustflags: "-C target-cpu=generic"
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64"
            archive: zip
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: "-C target-cpu=generic"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET"

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.name }}
        run: |
          mkdir -p package
          cp "target/$TARGET/release/eightchess" package/eightchess
          tar -C package -czf "$ASSET.tar.gz" eightchess
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.name }}
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/$env:TARGET/release/eightchess.exe" package/eightchess.exe
          Compress-Archive -Path package/eightchess.exe -DestinationPath "$env:ASSET.zip"
          (Get-FileHash "$env:ASSET.zip" -Algorithm SHA256).Hash.ToLower() + "  $env:ASSET.zip" | Set-Content "$env:ASSET.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
