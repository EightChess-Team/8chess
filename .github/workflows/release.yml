name: 8Chess Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64"
            builder: cargo
            platform: unix
            archive: tar.gz
          - name: linux-x86_64-v3
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v3"
            builder: cargo
            platform: unix
            archive: tar.gz
          - name: linux-x86_64-v4
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-cpu=x86-64-v4"
            builder: cargo
            platform: unix
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: "-C target-cpu=generic"
            builder: cargo
            features: --no-default-features
            platform: unix
            archive: tar.gz
          - name: linux-riscv64
            os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            rustflags: "-C target-cpu=generic-rv64"
            builder: cross
            features: --no-default-features
            platform: unix
            archive: tar.gz
          - name: linux-loongarch64
            os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            rustflags: "-C target-cpu=generic"
            linker: loongarch64-unknown-linux-gnu-gcc
            builder: zig
            features: --no-default-features
            platform: unix
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64"
            builder: cargo
            platform: windows
            archive: zip
          - name: windows-x86_64-v3
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v3"
            builder: cargo
            platform: windows
            archive: zip
          - name: windows-x86_64-v4
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v4"
            builder: cargo
            platform: windows
            archive: zip
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: "-C target-cpu=generic"
            builder: cargo
            platform: windows
            archive: zip
          - name: android-arm64
            os: ubuntu-latest
            target: aarch64-linux-android
            android_abi: arm64-v8a
            rustflags: "-C target-cpu=generic"
            builder: android
            features: --no-default-features
            platform: unix
            archive: tar.gz
          - name: android-armv7
            os: ubuntu-latest
            target: armv7-linux-androideabi
            android_abi: armeabi-v7a
            rustflags: "-C target-cpu=generic"
            builder: android
            features: --no-default-features
            platform: unix
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Install Zig
        if: matrix.builder == 'zig'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zig'
        run: cargo install cargo-zigbuild --locked

      - name: Setup Android
        if: matrix.builder == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        if: matrix.builder == 'android'
        shell: bash
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Install cargo-ndk
        if: matrix.builder == 'android'
        run: cargo install cargo-ndk --locked

      - name: Build cargo target
        if: matrix.builder == 'cargo'
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: cargo build --release --target "$TARGET" $FEATURES

      - name: Build cross target
        if: matrix.builder == 'cross'
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: cross build --release --target "$TARGET" $FEATURES

      - name: Build Zig target
        if: matrix.builder == 'zig'
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: cargo zigbuild --release --target "$TARGET" $FEATURES

      - name: Build Android target
        if: matrix.builder == 'android'
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
          ANDROID_ABI: ${{ matrix.android_abi }}
          FEATURES: ${{ matrix.features }}
        run: cargo ndk -t "$ANDROID_ABI" build --release --target "$TARGET" $FEATURES

      - name: Package Unix binary
        if: matrix.platform == 'unix'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.name }}
        run: |
          mkdir -p package
          cp "target/$TARGET/release/eightchess" package/eightchess
          tar -C package -czf "$ASSET.tar.gz" eightchess
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"

      - name: Package Windows binary
        if: matrix.platform == 'windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.name }}
        run: |
          mkdir -p package
          cp "target/$TARGET/release/eightchess.exe" package/eightchess.exe
          7z a "$ASSET.zip" package/eightchess.exe
          sha256sum "$ASSET.zip" > "$ASSET.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    name: Build macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Intel binary
        run: cargo build --release --target x86_64-apple-darwin --no-default-features
        env:
          RUSTFLAGS: "-C target-cpu=x86-64"

      - name: Build Apple Silicon binary
        run: cargo build --release --target aarch64-apple-darwin --no-default-features
        env:
          RUSTFLAGS: "-C target-cpu=generic"

      - name: Create universal package
        run: |
          mkdir -p package
          lipo -create \
            target/x86_64-apple-darwin/release/eightchess \
            target/aarch64-apple-darwin/release/eightchess \
            -output package/eightchess
          tar -C package -czf macos-universal.tar.gz eightchess
          shasum -a 256 macos-universal.tar.gz > macos-universal.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            macos-universal.tar.gz
            macos-universal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
