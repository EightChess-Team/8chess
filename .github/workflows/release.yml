name: 8Chess Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64
          - os: ubuntu-latest
            name: linux-x86_64-generic
            rustflags: "-C target-cpu=x86-64"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            name: linux-x86_64-avx2
            rustflags: "-C target-cpu=x86-64-v3"
            target: x86_64-unknown-linux-gnu
            sde_flag: -bdw
          - os: ubuntu-latest
            name: linux-x86_64-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C target-feature=+gfni,+avx512bw,+avx512vl,+avx512vbmi,+avx512vbmi2,+avx512vnni,+avx512bitalg"
            target: x86_64-unknown-linux-gnu
            sde_flag: -icx
          # Linux ARM64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            rustflags: "-C target-cpu=native"
            target: aarch64-unknown-linux-gnu
          # Linux RISC-V
          - os: ubuntu-latest
            name: linux-riscv64
            rustflags: "-C target-cpu=generic-rv64"
            target: riscv64gc-unknown-linux-gnu
            cross: true
          # Windows x86-64
          - os: windows-latest
            name: windows-x86_64-generic
            rustflags: "-C target-cpu=x86-64"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            name: windows-x86_64-avx2
            rustflags: "-C target-cpu=x86-64-v3"
            target: x86_64-pc-windows-msvc
            sde_flag: -bdw
          - os: windows-latest
            name: windows-x86_64-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C target-feature=+gfni,+avx512bw,+avx512vl,+avx512vbmi,+avx512vbmi2,+avx512vnni,+avx512bitalg"
            target: x86_64-pc-windows-msvc
            sde_flag: -icx
          # Windows ARM64
          - os: windows-11-arm
            name: windows-aarch64
            rustflags: "-C target-cpu=native"
            target: aarch64-pc-windows-msvc
          # macOS Intel
          - os: macos-13
            name: macos-x86_64
            rustflags: "-C target-cpu=native"
            target: x86_64-apple-darwin
          # macOS Apple Silicon
          - os: macos-latest
            name: macos-aarch64
            rustflags: "-C target-cpu=native"
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          rustup component add llvm-tools
          cargo install cargo-pgo
        shell: bash

      - name: Install cross-compilation tools
        if: matrix.cross == true
        run: |
          cargo install cross
        shell: bash

      - name: Setup Intel SDE
        if: matrix.sde_flag != ''
        uses: petarpetrovt/setup-sde@v5.0
        with:
          sdeVersion: "9.58.0"
          environmentVariableName: SDE_PATH

      - name: Instrument build for PGO
        run: |
          cargo pgo instrument --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"
        shell: bash

      - name: Run PGO profiling benchmarks
        if: matrix.sde_flag != ''
        run: |
          "$SDE_PATH/sde64" ${{ matrix.sde_flag }} -- cargo pgo run --target ${{ matrix.target }} -- bench
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"
        shell: bash

      - name: Run PGO profiling benchmarks
        if: matrix.sde_flag == ''
        run: |
          cargo pgo run --target ${{ matrix.target }} -- bench
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"
        shell: bash

      - name: Optimize build with PGO
        run: |
          cargo pgo optimize --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"
        shell: bash

      - name: Build binary
        if: matrix.cross != true
        run: |
          cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"
        shell: bash

      - name: Build binary (cross)
        if: matrix.cross == true
        run: |
          cross build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"
        shell: bash

      - name: Rename binary with platform suffix
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv target/${{ matrix.target }}/release/eightchess.exe ${{ matrix.name }}.exe
          else
            mv target/${{ matrix.target }}/release/eightchess ${{ matrix.name }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.exe
          retention-days: 7


  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.123

      - name: Build WASM
        run: |
          RUSTFLAGS="" cargo build --lib --target wasm32-unknown-unknown --release --no-default-features

      - name: Generate JS bindings
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/eightchess.wasm --target web --out-dir pkg

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: eightchess-wasm
          path: pkg/
          retention-days: 7

  release:
    name: Create release
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get short SHA hash
        id: hash
        run: echo "COMMIT_SHA=$(git rev-parse HEAD | cut -c 1-8)" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          name: 8Chess 2.0.0-dev-${{ env.COMMIT_SHA }}
          draft: true
          prerelease: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}