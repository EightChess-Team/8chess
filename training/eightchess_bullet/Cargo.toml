[package]
name = "eightchess_bullet"
version = "0.1.0"
edition = "2024"

[dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", package = "bullet_lib", features = ["cuda"] }
bullet_trainer = { git = "https://github.com/jw1912/bullet", package = "bullet-trainer", features = ["cuda"] }
bulletformat = "1.8.0"
montyformat = "0.9.2"
eightchess = { path = "../../", default-features = false }

[[bin]]
name = "eightchess_bullet"
path = "src/main.rs"
